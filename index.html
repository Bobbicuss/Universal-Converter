/* v1.14 prestige interaction layer — event-driven, never ambient motion. */
.value-wrap{isolation:isolate}
.value-wrap::after{
  content:"";
  position:absolute;
  left:1px;right:1px;top:1px;
  height:calc(var(--field-h) - 2px);
  border-radius:calc(var(--field-r) - 1px);
  pointer-events:none;
  z-index:2;
  opacity:0;
  background:linear-gradient(104deg,transparent 20%,color-mix(in srgb,var(--gloss-hi) 78%,transparent) 43%,color-mix(in srgb,var(--gloss-hi) 34%,transparent) 51%,transparent 72%);
  transform:translateX(-115%);
}
.value-wrap.focus-sheen::after{animation:focusSheen 190ms cubic-bezier(.2,.72,.18,1) both}
@keyframes focusSheen{
  0%{opacity:0;transform:translateX(-115%)}
  20%{opacity:.82}
  100%{opacity:0;transform:translateX(115%)}
}
.value-input.value-settle{animation:valueSettle 170ms cubic-bezier(.18,.72,.22,1)}
@keyframes valueSettle{
  0%{color:color-mix(in srgb,var(--accent-ink) 88%,var(--ink));text-shadow:0 0 9px color-mix(in srgb,var(--accent) 22%,transparent)}
  58%{color:var(--ink);text-shadow:0 0 3px color-mix(in srgb,var(--accent) 8%,transparent)}
  100%{color:var(--ink);text-shadow:none}
}
.instrument-head,#desktopBank,.perspective{transition:opacity 105ms ease,transform 125ms cubic-bezier(.2,.72,.2,1)}
.instrument.category-swap .instrument-head,.instrument.category-swap #desktopBank,.perspective.category-swap{opacity:0;transform:translateY(5px)}
.cat-btn.control-press{transform:translateY(1px) scale(.996)!important;box-shadow:inset 0 1px 2px color-mix(in srgb,var(--control-under) 30%,transparent),0 2px 7px color-mix(in srgb,var(--control-under) 22%,transparent)!important}

  m=s.match(/^([+-]?)([½¼¾⅓⅔⅛⅜⅝⅞])$/);
  if(m)return(m[1]==='-'?-1:1)*unicodeFrac[m[2]];
  if(!/^[+-]?(?:(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?|\.\d+)(?:[eE][+-]?\d+)?$/.test(s))return NaN;

}
function fractionToken(s){if(Object.hasOwn(unicodeFrac,s))return unicodeFrac[s];const m=s.match(/^(\d+)\s*\/\s*(\d+)$/);return m&&+m[2]?+m[1]/+m[2]:NaN;}
const aliasMatchers=Object.fromEntries(Object.entries(aliases).map(([cat,map])=>{
  const found=Object.entries(map).sort(([a],[b])=>b.length-a.length).map(([alias,id])=>({
    id,alias,
    re:new RegExp('^'+alias.split(' ').map(a=>a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s+')+'(?![a-z])','i')

}));
function validateBase(c,base){
  if(!Number.isFinite(base))return{ok:false,reason:'Value too large'};
  if(c.kind==='temperature'){
    if(base<-1e-9)return{ok:false,reason:'Below absolute zero'};
    return{ok:true,base:Math.max(0,base)};
  }
  if(base<0)return{ok:false,reason:'Negative value'};

function parseInput(category,rowUnit,raw){
  const c=cats[category],s=cleanRaw(raw);

  const direct=numberToken(s);
  if(Number.isFinite(direct))return validateBase(c,toBase(c,rowUnit,direct));
  const compoundEnabled=['liquid','dry','mass','distance'].includes(category);
  let rest=s,base=0,terms=0;
  while(rest){
    if(++terms>12)return{ok:false,reason:'Too many units'};
    const n=rest.match(initialNumberRe);
    if(!n)return{ok:false,reason:'Check value'};
    const val=numberToken(n[1]);
    if(!Number.isFinite(val))return{ok:false,reason:'Check value'};
    if(c.kind!=='temperature'&&val<0)return{ok:false,reason:'Negative value'};
    rest=rest.slice(n[1].length).trimStart();
    let match=null;
    for(const alias of aliasMatchers[category]){const hit=alias.re.exec(rest);if(hit){match={id:alias.id,consumed:hit[0].length};break;}}
    if(!match)return{ok:false,reason:'Check unit'};
    const unit=unitById(c,match.id);
    if(!unit)return{ok:false,reason:'Check unit'};
    const delta=toBase(c,unit,val);
    if(!Number.isFinite(delta))return{ok:false,reason:'Value too large'};
    if(c.kind==='temperature'){const single=validateBase(c,delta);if(!single.ok)return single;base=single.base;}
    else base+=delta;
    rest=rest.slice(match.consumed).trimStart();
    if(!rest)break;
    if(!compoundEnabled)return{ok:false,reason:'Use one unit only'};
    const before=rest;
    rest=rest.replace(/^(?:(?:and\b)|\+|,|;)\s*/i,'');
    if(!rest)return{ok:false,reason:'Incomplete value'};
    // Every additional term must begin with a number and an explicit unit.

}
function formatValue(v){
  if(!Number.isFinite(v))return'—';if(Object.is(v,-0)||v===0)return'0';
  const a=Math.abs(v);
  if(a>=1e12||a<1e-10)return v.toExponential(7).replace('e+','e');
  if(a>=1e9)return v.toLocaleString('en-US',{maximumFractionDigits:2});
  if(a>=1000)return v.toLocaleString('en-US',{maximumFractionDigits:4});
  if(a>=.001)return v.toLocaleString('en-US',{maximumSignificantDigits:8,useGrouping:a>=1});
  const exp=Math.floor(Math.log10(a));return trimZeros(v.toFixed(Math.min(18,Math.max(6,-exp+6))));
}
function trimZeros(s){if(!s.includes('.'))return s;return s.replace(/(\.\d*?[1-9])0+$/,'$1').replace(/\.0+$/,'')}
function expandTinyDecimal(a,sig=6){
  const [m,eRaw]=a.toExponential(sig-1).split('e'),e=Number(eRaw),digits=m.replace('.','').replace(/^0+/,'');
  if(e>=0){const whole=e+1;return whole>=digits.length?digits+'0'.repeat(whole-digits.length):digits.slice(0,whole)+'.'+digits.slice(whole)}
  return'0.'+'0'.repeat(Math.max(0,-e-1))+digits;
}
function formatAbsurdPercent(pct){
  if(!Number.isFinite(pct))return'—';if(pct===0)return'0';const neg=pct<0?'−':'',a=Math.abs(pct);
  if(a>=1000)return neg+a.toLocaleString(undefined,{maximumFractionDigits:6,useGrouping:true});
  if(a>=.000001)return neg+trimZeros(a.toFixed(8));
  return neg+trimZeros(expandTinyDecimal(a,6));
}
function sortedUnits(c,system){let arr=c.units.filter(u=>u.system===system);if(c.kind!=='temperature')arr=arr.slice().sort((a,b)=>state.order==='asc'?a.factor-b.factor:b.factor-a.factor);return arr}
const motionMQ=matchMedia('(prefers-reduced-motion: reduce)');
function motionAllowed(){return !motionMQ.matches}
let categoryTimer=0,settleFrame=0,perspectiveTimer=0;
function pressControl(el,duration=72){if(!el||!motionAllowed())return;el.classList.add('control-press');setTimeout(()=>el.classList.remove('control-press'),duration)}
function syncNav(first=false){
  const nav=$('#categoryNav'),target=nav.querySelector(`[data-cat="${state.category}"]`),underline=$('#activeUnderline');
  if(!target||!underline)return;
  if(first)underline.style.transition='none';
  underline.style.width=target.offsetWidth+'px';underline.style.transform=`translateX(${target.offsetLeft}px)`;
  if(first)requestAnimationFrame(()=>underline.style.removeProperty('transition'));
}
function renderNav(){
  const nav=$('#categoryNav');
  nav.innerHTML=Object.entries(cats).map(([id,c])=>`<button class="cat-btn" type="button" data-cat="${id}" aria-current="${id===state.category?'page':'false'}">${c.title}</button>`).join('')+'<span class="active-underline" id="activeUnderline" aria-hidden="true"></span>';
  $$('[data-cat]',nav).forEach(button=>button.addEventListener('click',()=>swapCategory(button.dataset.cat)));
  requestAnimationFrame(()=>syncNav(true));
}
function swapCategory(next){
  if(!cats[next]||next===state.category)return;
  state.category=next;
  $$('[data-cat]').forEach(b=>b.setAttribute('aria-current',b.dataset.cat===next?'page':'false'));
  syncNav();renderBank();updatePerspective();savePrefs();
  const rail=$('#tabRail'),button=rail.querySelector(`[data-cat="${next}"]`);
  if(button){const start=button.offsetLeft,end=start+button.offsetWidth;
    if(start<rail.scrollLeft)rail.scrollTo({left:Math.max(0,start-8),behavior:motionAllowed()?'smooth':'instant'});
    else if(end>rail.scrollLeft+rail.clientWidth)rail.scrollTo({left:end-rail.clientWidth+8,behavior:motionAllowed()?'smooth':'instant'});
  }
}
function rowMarkup(c,u){const src=state.sourceRaw[state.category],active=src.unit===u.id,display=active?src.raw:formatValue(fromBase(c,u,state.values[state.category])),aria=u.symbol?`${u.label} ${u.symbol}`:u.label;const rel=u.rel?`<div class="unit-rel">${u.rel}</div>`:'<div class="unit-rel"></div>';return `<div class="unit-row${active?' active':''}" data-row="${u.id}"><div class="unit-name"><div class="unit-label">${u.label}<span class="unit-symbol">${u.symbol}</span></div>${rel}</div><div class="value-wrap"><input class="value-input" data-unit="${u.id}" inputmode="text" enterkeyhint="done" autocomplete="off" spellcheck="false" aria-label="${aria}" value="${escAttr(display)}"><span class="validation" aria-live="polite"></span></div></div>`}
function tempDesktop(c){return `<div class="temperature-grid">${c.units.map(u=>{const src=state.sourceRaw[state.category],active=src.unit===u.id,display=active?src.raw:formatValue(fromBase(c,u,state.values[state.category]));return `<div class="temp-card unit-row${active?' active':''}" data-row="${u.id}" style="display:block"><div class="unit-name"><span class="system-chip">${u.system}</span><div class="unit-label">${u.label}<span class="unit-symbol">${u.symbol}</span></div></div><div class="value-wrap"><input class="value-input" data-unit="${u.id}" inputmode="text" autocomplete="off" spellcheck="false" aria-label="${u.symbol?`${u.label} ${u.symbol}`:u.label}" enterkeyhint="done" value="${escAttr(display)}"><span class="validation" aria-live="polite"></span></div></div>`}).join('')}</div>`}
function renderBank(){
  const c=cats[state.category],desktop=$('#desktopBank');
  $('#categoryTitle').textContent=c.title;
  const ob=$('#orderBtn');ob.hidden=c.kind==='temperature';ob.textContent=state.order==='asc'?'Smallest → largest':'Largest → smallest';
  if(c.kind==='temperature')desktop.innerHTML=tempDesktop(c);
  else desktop.innerHTML=`<div class="systems">${['US','Metric'].map(system=>{
    const units=sortedUnits(c,system);
    return`<section class="system-panel" aria-label="${system} units"><div class="system-head"><span class="system-name">${system}</span><span class="system-count">${units.length} units</span></div><div class="unit-list">${units.map(u=>rowMarkup(c,u)).join('')}</div></section>`;
  }).join('')}</div>`;
  bindInputs();
  const raw=state.sourceRaw[state.category];
  if(!raw.valid){const field=$('.value-input[data-unit="'+CSS.escape(raw.unit)+'"]');if(field)setError(field,raw.reason||'Check value');}
}
function runFocusSheen(inp){if(!motionAllowed())return;const wrap=inp.closest('.value-wrap');if(!wrap)return;wrap.classList.remove('focus-sheen');void wrap.offsetWidth;wrap.classList.add('focus-sheen');setTimeout(()=>wrap.classList.remove('focus-sheen'),220)}
function bindInputs(){
  const fields=$$('.value-input');
  fields.forEach((inp,i)=>{
    inp.setAttribute('enterkeyhint',i===fields.length-1?'done':'next');
    inp.addEventListener('focus',()=>{markActive(inp.dataset.unit);runFocusSheen(inp)});
    inp.addEventListener('pointerdown',()=>{inp.dataset.focusedBefore=document.activeElement===inp?'yes':'no'});
    inp.addEventListener('click',()=>{if(inp.dataset.focusedBefore==='yes')inp.select();inp.dataset.focusedBefore='no'});
    inp.addEventListener('input',()=>onInput(inp));
    inp.addEventListener('keydown',e=>onInputKey(e,inp));
    inp.addEventListener('animationend',()=>inp.classList.remove('value-settle'));
    inp.addEventListener('blur',()=>{delete inp.dataset.focusedBefore});
  });
}
function setError(inp,reason){
  inp.setAttribute('aria-invalid',reason?'true':'false');
  const msg=inp.closest('.value-wrap')?.querySelector('.validation');if(msg)msg.textContent=reason||'';
}
function markActive(id){
  const c=cats[state.category],u=unitById(c,id);if(!u)return;
  const prev=state.sourceRaw[state.category];
  if(!prev.valid&&prev.unit!==id){
    const old=$('.value-input[data-unit="'+CSS.escape(prev.unit)+'"]'),oldUnit=unitById(c,prev.unit);
    if(old&&oldUnit){old.value=formatValue(fromBase(c,oldUnit,state.values[state.category]));setError(old,'');}
  }
  if(!(prev.unit===id&&!prev.valid))state.sourceRaw[state.category]={unit:id,raw:$('.value-input[data-unit="'+CSS.escape(id)+'"]')?.value??'',valid:true,reason:''};
  $$('[data-row]').forEach(r=>r.classList.toggle('active',r.dataset.row===id));
}
function onInput(inp){
  const c=cats[state.category],u=unitById(c,inp.dataset.unit),parsed=parseInput(state.category,u,inp.value);
  state.sourceRaw[state.category]={unit:u.id,raw:inp.value,valid:parsed.ok,reason:parsed.reason||''};
  setError(inp,parsed.ok?'':parsed.reason||'Check value');
  if(!parsed.ok)return;
  state.values[state.category]=parsed.base;
  updateVisibleValues(u.id,inp);updatePerspective(true);
}
function onInputKey(e,inp){
  if(e.key==='Escape'){
    e.preventDefault();const c=cats[state.category],u=unitById(c,inp.dataset.unit);
    inp.value=formatValue(fromBase(c,u,state.values[state.category]));
    state.sourceRaw[state.category]={unit:u.id,raw:inp.value,valid:true,reason:''};
    setError(inp,'');updateVisibleValues(u.id,inp);inp.select();return;
  }

    e.preventDefault();const fields=$$('.value-input'),i=fields.indexOf(inp);

    if(target){target.focus();target.select()}else if(e.key==='Enter')inp.blur();

}
function updateVisibleValues(sourceId,sourceEl){const c=cats[state.category],settle=[];$$('.value-input').forEach(inp=>{if(inp===sourceEl)return;const u=unitById(c,inp.dataset.unit);if(!u)return;const next=formatValue(fromBase(c,u,state.values[state.category]));if(inp.value!==next){inp.value=next;if(motionAllowed()){inp.classList.remove('value-settle');settle.push(inp)}}inp.setAttribute('aria-invalid','false');const m=inp.closest('.value-wrap')?.querySelector('.validation');if(m)m.textContent=''});if(settle.length){cancelAnimationFrame(settleFrame);settleFrame=requestAnimationFrame(()=>settle.forEach(inp=>inp.classList.add('value-settle')))}$$('[data-row]').forEach(r=>r.classList.toggle('active',r.dataset.row===sourceId));}
function updatePerspective(pulse=false){
  const c=cats[state.category],base=state.values[state.category],pct=(base/c.benchmark)*100,el=$('#perspectiveSentence');
  el.innerHTML=`Your measurement is <span class="perspective-number">${formatAbsurdPercent(pct)}%</span> of ${c.benchmarkLabel}.`;
  if(pulse&&motionAllowed()){
    const span=el.querySelector('.perspective-number');span.classList.add('perspective-pulse');
    clearTimeout(perspectiveTimer);perspectiveTimer=setTimeout(()=>span.isConnected&&span.classList.remove('perspective-pulse'),170);
  }
}
function escAttr(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){renderNav();renderBank();updatePerspective();}
const themeModes=['auto','light','dark'];
function applyTheme(){
  const theme=root.dataset.theme||'auto';root.dataset.theme=theme;
  const label=theme.charAt(0).toUpperCase()+theme.slice(1),next=themeModes[(themeModes.indexOf(theme)+1)%3];
  $('#themeMode').textContent=label;
  $('#themeBtn').setAttribute('aria-label',`Theme: ${label}. Activate for ${next.charAt(0).toUpperCase()+next.slice(1)}`);
  const dark=theme==='dark'||(theme==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
  $('#themeColor')?.setAttribute('content',dark?'#090c12':'#f5f7fb');
}
function toggleTheme(){
  const current=root.dataset.theme||'auto';root.dataset.theme=themeModes[(themeModes.indexOf(current)+1)%3];
  applyTheme();try{localStorage.setItem('unitConverter.theme',root.dataset.theme)}catch(_){}
}
function savePrefs(){try{localStorage.setItem('unitConverter.prefs',JSON.stringify({category:state.category,order:state.order}))}catch(_){}}
function loadPrefs(){
  try{const th=localStorage.getItem('unitConverter.theme');
    if(themeModes.includes(th))root.dataset.theme=th;
    else if(th==='')root.dataset.theme='auto';
    const p=JSON.parse(localStorage.getItem('unitConverter.prefs')||'null');
    if(p&&cats[p.category])state.category=p.category;
    if(p&&(p.order==='asc'||p.order==='desc'))state.order=p.order;
  }catch(_){}
}
loadPrefs();applyTheme();render();
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>{if(root.dataset.theme==='auto')applyTheme()});
$('#themeBtn').addEventListener('pointerdown',e=>pressControl(e.currentTarget));
$('#themeBtn').addEventListener('click',toggleTheme);
$('#orderBtn').addEventListener('pointerdown',e=>pressControl(e.currentTarget));
$('#orderBtn').addEventListener('click',()=>{state.order=state.order==='asc'?'desc':'asc';renderBank();savePrefs()});
window.addEventListener('resize',()=>requestAnimationFrame(()=>syncNav(true)),{passive:true});
// Read-only QA hooks: no external mutation of app state.
Object.defineProperty(window,'__converterQA',{configurable:true,value:Object.freeze({
  parse:(category,id,raw)=>parseInput(category,unitById(cats[category],id),raw),
  factor:(category,id)=>unitById(cats[category],id).factor,
  categoryNames:()=>Object.keys(cats),
  base:category=>state.values[category]
})});
})();
</script>
